[project]
name = "zharinoff-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Maxim Zharinoff",email = "m.zharinoff@vk.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "redis (>=8.1.0,<9.0.0)",
    "aiogram (>=3.31.0,<4.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.5,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
